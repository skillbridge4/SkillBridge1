<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />
  
  <g filter="url(#shadow)">
    <!-- Graduation Cap / Diamond Peak -->
    <path d="M 256 120 L 390 190 L 256 260 L 122 190 Z" fill="url(#bridgeGrad)" />
    
    <!-- Cap Underneath Silhouette -->
    <path d="M 170 216 L 170 280 C 170 320 342 320 342 280 L 342 216 L 256 260 Z" fill="#ffffff" fill-opacity="0.85" />
    
    <!-- Tassel -->
    <path d="M 390 190 L 406 270 C 406 285 396 295 396 295" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
    <circle cx="396" cy="300" r="9" fill="#fcd34d" />
    
    <!-- Dynamic Bridge Arch Connecting to the Future -->
    <path d="M 110 370 C 180 270 332 270 402 370 C 370 384 142 384 110 370 Z" fill="#ffffff" />
    
    <!-- Bridge Roadway Stripes -->
    <path d="M 256 320 L 256 360" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 332 L 202 362" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" />
    <path d="M 302 332 L 310 362" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" />
  </g>
  
  <!-- Sparkle of Success / Growth -->
  <path d="M 380 130 Q 380 150 400 150 Q 380 150 380 170 Q 380 150 360 150 Q 380 150 380 130 Z" fill="#fde047" />
  <circle cx="140" cy="150" r="6" fill="#a5f3fc" />
</svg>
